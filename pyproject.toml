[project]
name = "tempo-cli"
version = "10.0.0-dev.40157669839"
description = "Unreal Engine modding tool, that covers project management, automated builds, and more"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = []
authors = [
  { name = "Mythical", email = "MythicalData@gmail.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "click>=8.5",
    "mkdocs-material>=9.7.1",
    "platformdirs>=4.11.8",
    "prek>=0.3.9",
    "psutil>=7.2.2",
    "questionary>=2.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-click>=1.9.4",
    "screeninfo>=0.8.1",
    "tempo-core",
    "tomlkit>=0.13.3",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "click>=8.4.2",
    "commitizen>=4.16.5",
    "importtime>=1.0.3.2",
    "mkdocs-click>=0.9.0",
    "mkdocs-material>=9.6.15",
    "mkdocstrings-python>=1.16.12",
    "prek>=0.3.9",
    "pyinstaller>=6.14.2",
    "ruff>=0.12.2",
    "ty>=0.0.31",
]
x86-64-pc-windows-msvc = []
i686-pc-windows-msvc = []
x86-64-unknown-linux-gnu = []
aarch64-unknown-linux-gnu = []

[project.urls]
Documentation = "https://github.com/Tempo-Organization/tempo-cli/blob/main/README.md"
Issues = "https://github.com/Tempo-Organization/tempo-cli/issues"
Source = "https://github.com/Tempo-Organization/tempo-cli"

[project.scripts]
tempo_cli = "tempo_cli.__main__:main"

[project.entry-points."tempo.tools"]
retoc = "tempo_binary_tools.retoc:RetocToolInfo"
repak = "tempo_binary_tools.repak:RepakToolInfo"
fmodel = "tempo_binary_tools.fmodel:FmodelToolInfo"
umodel = "tempo_binary_tools.umodel:UmodelToolInfo"
uasset_gui = "tempo_binary_tools.uasset_gui:UassetGuiToolInfo"
kismet_analyzer = "tempo_binary_tools.kismet_analyzer:KismetAnalyzerToolInfo"
injector = "tempo_binary_tools.injector:InjectorToolInfo"
spaghetti = "tempo_binary_tools.spaghetti:SpaghettiToolInfo"
stove = "tempo_binary_tools.stove:StoveToolInfo"
ue_vr = "tempo_binary_tools.ue_vr:UEVRToolInfo"
jmap = "tempo_binary_tools.jmap:JmapToolInfo"
patternsleuth = "tempo_binary_tools.patternsleuth:PatternsleuthToolInfo"
tempo_shell_scripts = "tempo_binary_tools.tempo_shell_scripts:TempoShellScriptsToolInfo"

[tool.ruff]
exclude = [
    "src/tempo_cli/cli.py"
]

[tool.ruff.lint]
select = [
    "ANN",
    "PTH",
    "N",
    "BLE",
    "YTT",
    "ASYNC",
    "B",
    "A",
    "COM",
    "C4",
    "EXE",
    "FA",
    "INT",
    "PIE",
    "T20",
    "PYI",
    "UP047"
]

[tool.ty.src]
include = ["src", "tests"]
exclude = []


[tool.typos]
[tool.typos.default]
extend-words = { ue = "ue" }


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.uv.sources]
tempo-core = { git = "https://github.com/Tempo-Organization/tempo-core" }
